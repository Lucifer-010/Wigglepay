version: '3.9'

services:
  # ----------------------------------------------------------------------------
  # 1. Django REST Framework HTTP Gateway (Gunicorn)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn wigglepay.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - RUN_MIGRATIONS=true
      - USE_SQLITE_FALLBACK=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Django Channels ASGI Real-Time Engine (Daphne WebSockets)
  # ----------------------------------------------------------------------------
  channels:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 wigglepay.asgi:application
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - USE_SQLITE_FALLBACK=False
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - postgres
      - web

  # ----------------------------------------------------------------------------
  # 3. Asynchronous Worker Topology (Celery 3-Queue Architecture)
  #    - stellar_queue: High-priority ledger validation & path payments
  #    - ai_queue: Voice decoding (Whisper) & LLM entity extraction (Ollama Qwen)
  #    - webhook_queue: Merchant dispatches with HMAC-SHA256 & backoff retries
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A wigglepay worker -l info -Q stellar_queue,ai_queue,webhook_queue -c 4
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file: .env
    environment:
      - USE_SQLITE_FALLBACK=False
    depends_on:
      - redis
      - postgres
      - web

  # ----------------------------------------------------------------------------
  # 4. Celery Beat Periodic Task Scheduler
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A wigglepay beat -l info
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - USE_SQLITE_FALLBACK=False
    depends_on:
      - redis
      - postgres
      - web

  # ----------------------------------------------------------------------------
  # 5. Stellar Horizon SSE Payment Listener Daemon
  # ----------------------------------------------------------------------------
  stellar_daemon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py listen_horizon_stream
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - USE_SQLITE_FALLBACK=False
    restart: always
    depends_on:
      - redis
      - postgres
      - web

  # ----------------------------------------------------------------------------
  # 6. Telegram Bot Polling Daemon (Runs bot locally without public webhook)
  # ----------------------------------------------------------------------------
  telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py run_telegram_bot
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - USE_SQLITE_FALLBACK=False
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - web

  # ----------------------------------------------------------------------------
  # 7. AI Model Server: Ollama (Lightweight Qwen3 4B / Qwen2.5)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 8. PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wigglepay_db}
      POSTGRES_USER: ${POSTGRES_USER:-wigglepay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wigglepay_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wigglepay} -d ${POSTGRES_DB:-wigglepay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 9. Redis 7 Broker & WebSocket Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 10. React Merchant Portal & Payer UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://web:8000
      - VITE_WS_URL=ws://channels:8001

  # ----------------------------------------------------------------------------
  # 11. NGINX Reverse Proxy Gateway
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web
      - channels
      - frontend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  static_volume:
  media_volume:

